<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduNexa | Quản trị nền tảng</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>EduNexa</strong><span class="sub">Admin Console · V0.2.0-B DEV</span></div><button id="logout" hidden>Đăng xuất</button></header>
<main><section id="login" class="panel"><h1>Đăng nhập quản trị</h1><p>Sử dụng tài khoản Supabase Auth đã được cấp quyền quản trị nền tảng.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button>Đăng nhập</button></form></section>
<section id="app" hidden><div class="heading"><div><h1>Quản lý trường học</h1><p>Quản lý đơn vị thí điểm · Development</p></div><button id="refresh" class="outline">Tải lại</button></div><div class="layout"><section class="panel"><h2>Thêm trường (bản nháp)</h2><form id="createForm"><label>Mã trường<input id="code" placeholder="VD: LHP-HP-PILOT" required maxlength="32"></label><label>Tên trường<input id="name" required maxlength="200"></label><label>Cấp học<select id="level"><option value="upper_secondary">THPT</option><option value="lower_secondary">THCS</option><option value="primary">Tiểu học</option><option value="preschool">Mầm non</option><option value="multi_level">Nhiều cấp học</option></select></label><button>Tạo bản nháp</button></form></section><section class="panel wide"><h2>Danh sách trường</h2><div id="schools" class="schools"></div></section></div></section><p id="message" role="status" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
